<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>민영 Young Min</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <!-- 배경 꽃잎 장식 -->
  <div class="petals" aria-hidden="true"></div>

  <!-- 고정 헤더 -->
  <header class="header" id="top">
    <div class="header__inner">
      <a href="#top" class="brand" id="brand"></a>
      <div class="header__right">
        <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>
        <a class="header-cta" href="#contact">연락하기</a>
        <button class="lock-btn" id="lockBtn" aria-label="관리자 모드" title="관리자 모드">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="hero"></section>
    <div id="sections"></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- 맨 위로 버튼 -->
  <button class="to-top" id="toTop" aria-label="맨 위로 이동">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5l-7 7m7-7l7 7M12 5v14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 순서 중요: 설정 → 저장소(관리자가 고친 설정 적용) → 기능들 → 화면 그리기 -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/participate.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/main.js"></script>
  <script src="js/welcome.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
